# Append this to ~/.config/hypr/bindings.conf (or a file sourced by hyprland.conf).
#
# Super+Ctrl+J toggles the voice-launcher service on/off and flashes a
# notification with the new state.

bindd = SUPER CTRL, J, Toggle Jarvis (voice launcher), exec, jarvis toggle-notify

# Super+Ctrl+H aciona a escuta imediatamente (push-to-talk, sem wake word).
bindd = SUPER CTRL, H, Jarvis push-to-talk, exec, systemctl --user kill -s SIGUSR1 voice-launcher.service
